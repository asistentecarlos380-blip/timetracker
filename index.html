<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Asistencia - Matrix Style</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            background: #000;
        }
    </style>
</head>
<body class="text-slate-100 min-h-screen flex flex-col justify-between relative overflow-x-hidden">

    <!-- Fondo Matrix dinámico -->
    <canvas id="matrix-bg"></canvas>

    <!-- LOGIN SCREEN -->
    <div id="login-screen" class="flex items-center justify-center flex-grow p-4 z-10">
        <div class="bg-slate-900/90 border border-emerald-500/30 p-8 rounded-2xl shadow-2xl shadow-emerald-950/50 w-full max-w-md backdrop-blur-md">
            
            <div class="flex flex-col items-center mb-6">
                <div class="w-12 h-12 bg-emerald-500/10 border border-emerald-500/30 rounded-full flex items-center justify-center mb-3">
                    <svg class="w-6 h-6 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path>
                    </svg>
                </div>
                <h1 class="text-2xl font-bold tracking-wide text-emerald-400">Control de Asistencia</h1>
                <p class="text-xs text-slate-400 mt-1">Sistema de fichaje y gestión segura</p>
            </div>

            <form id="login-form" class="space-y-4" onsubmit="handleLogin(event)">
                <div>
                    <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1 font-semibold">Usuario</label>
                    <input type="text" id="username" required class="w-full bg-slate-950/60 border border-slate-800 rounded-lg px-4 py-3 text-slate-100 focus:outline-none focus:border-emerald-500 transition-colors" placeholder="Ingrese su usuario">
                </div>

                <div>
                    <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1 font-semibold">PIN</label>
                    <div class="relative">
                        <input type="password" id="pin" required class="w-full bg-slate-950/60 border border-slate-800 rounded-lg px-4 py-3 text-slate-100 focus:outline-none focus:border-emerald-500 transition-colors" placeholder="••••">
                    </div>
                </div>

                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-slate-950 font-bold py-3 rounded-lg shadow-lg shadow-emerald-900/30 transition-all cursor-pointer">
                    Ingresar al Sistema
                </button>

                <!-- Mensaje de estado oculto por defecto para evitar el "Not Found" -->
                <div id="login-status" class="text-red-400 text-xs text-center mt-2 hidden"></div>
            </form>
        </div>
    </div>

    <!-- Script de fondo Matrix -->
    <script>
        const canvas = document.getElementById('matrix-bg');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const characters = '01ABCDEFHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz';
        const fontSize = 14;
        let columns = canvas.width / fontSize;
        let drops = [];

        for (let i = 0; i < columns; i++) {
            drops[i] = 1;
        }

        function drawMatrix() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#10b981';
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < drops.length; i++) {
                const text = characters.charAt(Math.floor(Math.random() * characters.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 33);

        function handleLogin(e) {
            e.preventDefault();
            // Lógica de inicio de sesión conectada a tu backend
        }
    </script>
</body>
</html>
